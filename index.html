<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ErsatzTV channel logos</title>
  <style>
    body{font:16px system-ui,sans-serif;max-width:900px;margin:2rem auto;padding:0 1rem;background:#111;color:#eee}
    h1{font-size:1.7rem} .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:1rem}
    figure{margin:0;padding:1rem;background:#222;border-radius:.75rem;text-align:center}
    img{width:100%;height:130px;object-fit:contain} figcaption{margin-top:.75rem}
  </style>
</head>
<body>
  <h1>ErsatzTV channel logos</h1>
  <div class="grid">
    <figure><img src="logos/adult-animation.png" alt="Adult Animation"><figcaption>Adult Animation</figcaption></figure>
    <figure><img src="logos/cartoon-retro.png" alt="Cartoon Retro"><figcaption>Cartoon Retro</figcaption></figure>
    <figure><img src="logos/nature.jpg" alt="Nature"><figcaption>Nature</figcaption></figure>
    <figure><img src="logos/christmas-channel.png" alt="Christmas Channel"><figcaption>Christmas Channel</figcaption></figure>
    <figure><img src="logos/halloween-channel.png" alt="Halloween Channel"><figcaption>Halloween Channel</figcaption></figure>
    <figure><img src="logos/kids-cartoons-two.png" alt="Kids Cartoons Two"><figcaption>Kids Cartoons Two</figcaption></figure>
  </div>
</body>
</html>
